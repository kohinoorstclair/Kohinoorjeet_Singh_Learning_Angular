<div class="modify-list-item">
  <div *ngIf="errorMessage" class="error-message">
    <mat-card class="error-card">{{ errorMessage }}</mat-card>
  </div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Product' : 'Create Product' }}</mat-card-title>
    </mat-card-header>

    <br>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <br>
      <mat-form-field appearance="fill" class="form-group">
        <br>
        <mat-label>Product Name</mat-label>
        <input
          matInput
          id="name"
          formControlName="name"
          type="text"
          [readonly]="isEditMode"
          appHighlightOnFocus
          [focusColor]="'white'"
          matTooltip="Enter the name of the product. E.g., 'Apple iPhone 12'."
          matTooltipPosition="above"
        aria-label="Product Name"
        />
      </mat-form-field>

      <mat-form-field class="form-group">
        <mat-label>Price</mat-label>
        <input
          matInput
          id="price"
          formControlName="price"
          type="number"
          appHighlightOnFocus
          [focusColor]="'lightblue'"
          matTooltip="Enter the product price in USD. E.g., '599.99'."
          matTooltipPosition="above"
        aria-label="Price"
        />
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-group">
        <mat-label>Brand</mat-label>
        <input
          matInput
          id="brand"
          formControlName="brand"
          type="text"
          appHighlightOnFocus
          [focusColor]="'lightblue'"
          matTooltip="Enter the brand name of the product. E.g., 'Apple', 'Samsung'."
          matTooltipPosition="above"
        aria-label="Brand"
        />
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-group">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          id="description"
          formControlName="description"
          rows="3"
          matTooltip="Provide a brief description of the product. E.g., 'Latest smartphone with 5G support'."
          matTooltipPosition="above"
        aria-label="Description"
        ></textarea>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-group">
        <mat-label>Stock</mat-label>
        <input
          matInput
          id="stock"
          formControlName="stock"
          type="number"
          appHighlightOnFocus
          [focusColor]="'lightblue'"
          matTooltip="Enter the available quantity of this product in stock."
          matTooltipPosition="above"
        aria-label="Stock"
        />
      </mat-form-field>

      <div class="form-actions">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="productForm.invalid"
        >
          {{ isEditMode ? 'Save Changes' : 'Create Product' }}
        </button>
        <button mat-raised-button color="warn" type="button" (click)="onReset()">
          Reset
        </button>
      </div>
    </form>
  </mat-card>
</div>
