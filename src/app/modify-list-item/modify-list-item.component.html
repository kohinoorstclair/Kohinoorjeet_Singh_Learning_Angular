<div class="modify-list-item">
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <h1>{{ isEditMode ? 'Edit Product' : 'Create Product' }}</h1>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">


    <div class="form-group">
      <label for="name">Product Name</label>
      <input id="name" formControlName="name" type="text" [readonly]="isEditMode" appHighlightOnFocus [focusColor]="'white'" >
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input id="price" formControlName="price" type="number" appHighlightOnFocus [focusColor]="'lightblue'">
    </div>

    <div class="form-group">
      <label for="brand">Brand</label>
      <input id="brand" formControlName="brand" type="text" appHighlightOnFocus [focusColor]="'lightblue'">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description"></textarea>
    </div>

    <div class="form-group">
      <label for="stock">Stock</label>
      <input id="stock" formControlName="stock" type="number" appHighlightOnFocus [focusColor]="'lightblue'">
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="productForm.invalid">
        {{ isEditMode ? 'Save Changes' : 'Create Product' }}
      </button>
      <button type="button" (click)="onReset()">Reset</button>
    </div>
  </form>
</div>
