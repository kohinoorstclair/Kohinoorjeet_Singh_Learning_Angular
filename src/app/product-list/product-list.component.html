<div *ngFor="let product of products; let i = index" class="contentList">
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <app-product-list-item
    [product]="product"
    [index]="i">

  </app-product-list-item>
  <button (click)="onEdit(product.productId)">Edit</button>

  <button (click)="onDelete(product.productId)">Delete</button>
</div>
